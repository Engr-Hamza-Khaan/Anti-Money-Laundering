<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL — AML/KYC Compliance Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page-a:#F4F9FD;
  --page-b:#E3EEF7;
  --surface:#FFFFFF;
  --surface2:#F5F8FB;
  --line:#DCE6EF;
  --ink:#10202F;
  --text:#2A3B4C;
  --muted:#6B7F92;
  --teal:#0FA98A;
  --blue:#3B7DE8;
  --amber:#E39A0C;
  --coral:#E2493C;
  --violet:#8B5CF6;
  --gold:#C9962C;
  --green:#22C55E;
  --grad-a:#C084FC;
  --grad-b:#34E0C0;
  --shadow:0 10px 30px -12px rgba(16,32,47,.18);
  --shadow-lg:0 22px 50px -20px rgba(16,32,47,.28);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --r:12px;

  /* legacy aliases — the existing rules below still reference these names.
     Mapping them here converts the whole sheet without touching every rule. */
  --bg:var(--page-a);
  --bg2:var(--page-b);
  --panel:var(--surface);
  --panel2:var(--surface2);
  --panel3:#E9F0F7;
  --border:var(--line);
  --border2:#C6D5E4;
  --dim:#8FA1B3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:linear-gradient(160deg,var(--page-a) 0%,var(--page-b) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--sans);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--ink)}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
#confetti{position:fixed;inset:0;z-index:90;pointer-events:none}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ---------------- top bar ---------------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;
  padding:12px 22px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); box-shadow:0 4px 20px -14px rgba(16,32,47,.35);
}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.brand svg{width:34px;height:34px;flex:none}
.brand-txt .n{font-weight:700;font-size:15px;letter-spacing:.14em}
.brand-txt .t{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.tb-spacer{flex:1}

.rankchip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:40px;padding:5px 14px 5px 6px}
.rankchip svg{width:30px;height:30px;flex:none}
.rankchip .rk{font-size:12px;font-weight:600;line-height:1.25}
.rankchip .xp{font-family:var(--mono);font-size:10px;color:var(--muted)}
.xpbar{width:120px;height:5px;background:var(--panel3);border-radius:4px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:4px;transition:width .7s cubic-bezier(.2,.9,.3,1)}

.iconbtn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);cursor:pointer;
  display:grid;place-items:center;transition:.18s;flex:none;
}
.iconbtn:hover{color:var(--text);border-color:var(--border2);background:var(--panel2)}
.iconbtn svg{width:17px;height:17px}

/* ---------------- stage ---------------- */
#stage{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:30px 22px 70px}
.screen{animation:fadeUp .45s cubic-bezier(.2,.9,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------------- hero ---------------- */
.hero{
  position:relative;display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:center;
  background:linear-gradient(135deg,#FFFFFF 0%,#F3F8FD 60%,#EAF3FB 100%);
  border:1px solid var(--line);border-radius:18px;padding:34px 34px;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(700px 240px at 88% 22%,rgba(43,217,176,.20),transparent 65%),
             radial-gradient(500px 220px at 10% 100%,rgba(76,141,246,.16),transparent 70%);
}
.hero-l{position:relative;z-index:2}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--teal);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--teal)}
.hero h1{font-size:38px;line-height:1.08;font-weight:700;letter-spacing:-.02em;margin:12px 0 12px}
.hero h1 em{font-style:normal;background:linear-gradient(92deg,var(--teal),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14.5px;line-height:1.65;max-width:52ch}
.hero-art{position:relative;z-index:2;display:grid;place-items:center}
.hero-art svg{width:100%;max-width:310px;height:auto}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:26px}.hero h1{font-size:29px}.hero-art{display:none}}

.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{background:rgba(255,255,255,.72);border:1px solid var(--border);border-radius:10px;padding:9px 14px;min-width:96px}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:600}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}

/* ---------------- section head ---------------- */
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:38px 0 16px}
.sechead h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sechead .d{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---------------- mission grid ---------------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.mcard{
  position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:20px;cursor:pointer;overflow:hidden;transition:.22s cubic-bezier(.2,.9,.3,1);
  display:flex;flex-direction:column;min-height:238px;
}
.mcard::before{content:'';position:absolute;left:0;top:0;height:3px;width:100%;background:var(--c);opacity:.85}
.mcard::after{content:'';position:absolute;right:-70px;top:-70px;width:190px;height:190px;border-radius:50%;background:var(--c);opacity:.06;transition:.3s}
.mcard:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--shadow-lg)}
.mcard:hover::after{opacity:.13;transform:scale(1.15)}
.micon{width:48px;height:48px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent);margin-bottom:14px;position:relative;z-index:2}
.micon svg{width:25px;height:25px;color:var(--c)}
.mcard h3{font-size:15.5px;font-weight:600;position:relative;z-index:2}
.mcard .mk{font-family:var(--mono);font-size:10px;color:var(--c);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;position:relative;z-index:2}
.mcard p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:8px;flex:1;position:relative;z-index:2}
.mfoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--border);position:relative;z-index:2}
.mmeta{font-family:var(--mono);font-size:11px;color:var(--dim)}
.mbest{font-family:var(--mono);font-size:11px;color:var(--teal)}
.play{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c)}

/* ---------------- buttons ---------------- */
.btn{
  font-family:var(--sans);font-weight:600;font-size:13.5px;
  padding:12px 22px;border-radius:9px;border:1px solid var(--border2);
  background:var(--panel2);color:var(--text);cursor:pointer;transition:.18s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:var(--panel3);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--teal),#0B8F74);color:#FFFFFF;border-color:transparent;box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.09)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;justify-content:center}
.btn svg,.back svg,.play svg{width:15px;height:15px;flex:none}

/* ---------------- generic panel ---------------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.panel.alt{background:var(--panel2)}
.panel,.mcard,.stat,.hudpill,.rankchip,.iconbtn{box-shadow:var(--shadow)}
.stat{background:var(--surface)}

/* mission chrome */
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.mhead .back{cursor:pointer;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);padding:8px 13px;border-radius:8px;transition:.18s}
.mhead .back:hover{color:var(--text);border-color:var(--border2)}
.mhead h2{font-size:18px;font-weight:600}
.mhead .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.mhead-spacer{flex:1}

.hudpill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 13px;font-family:var(--mono);font-size:12px}
.hudpill b{font-weight:600}
.hudpill .lbl{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}

.progline{height:4px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progline i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .45s cubic-bezier(.2,.9,.3,1)}

/* ---------------- dialogue mission ---------------- */
.dlg-wrap{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.dlg-wrap{grid-template-columns:1fr}}
.persona{text-align:center}
.persona .av{width:150px;height:150px;margin:0 auto 14px;filter:drop-shadow(0 12px 24px rgba(16,32,47,.22))}
.persona .nm{font-size:15px;font-weight:600}
.persona .rl{font-size:12px;color:var(--muted);margin-top:3px}
.meterlist{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);text-align:left}
.meter{margin-bottom:12px}
.meter .mrow{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.meter .mrow span:first-child{color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter .mrow span:last-child{font-family:var(--mono)}
.meter .bar{height:6px;background:var(--panel3);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.9,.3,1)}

.cdd-steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.cdd-step{flex:1;min-width:78px;text-align:center;padding:8px 4px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:10px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;transition:.3s}
.cdd-step.on{background:color-mix(in srgb,var(--teal) 13%,transparent);border-color:var(--teal);color:var(--teal)}
.cdd-step.done{color:var(--muted);border-color:var(--border2)}

.bubble{
  position:relative;background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:10px;padding:16px 18px;font-size:14.5px;line-height:1.7;margin-bottom:8px;
  animation:pop .35s cubic-bezier(.2,1.2,.4,1);
}
@keyframes pop{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.bubble.sys{border-left-color:var(--violet);background:var(--panel);font-size:13px;color:var(--muted);font-style:italic}
.bubble .who{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:7px}
.bubble.sys .who{color:var(--violet)}
.dlg-log{max-height:230px;overflow-y:auto;margin-bottom:14px;padding-right:6px}
.dlg-log::-webkit-scrollbar{width:5px}
.dlg-log::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.dlg-log .bubble{opacity:.5;font-size:13px;padding:11px 14px}
.dlg-log .you{border-left-color:var(--teal)}
.dlg-log .you .who{color:var(--teal)}

.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.choice{
  text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;font-size:13.5px;line-height:1.55;color:var(--text);cursor:pointer;
  transition:.16s;font-family:var(--sans);display:flex;gap:12px;align-items:flex-start;
}
.choice:hover:not(:disabled){border-color:var(--teal);background:var(--panel2);transform:translateX(3px)}
.choice:disabled{cursor:default}
.choice .num{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;margin-top:2px;width:16px}
.choice.good{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 9%,transparent)}
.choice.bad{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 9%,transparent)}
.choice.meh{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent)}
.choice.faded{opacity:.32}

/* ---------------- verdict / feedback ---------------- */
.verdict{
  margin-top:16px;padding:15px 17px;border-radius:10px;border-left:3px solid;
  font-size:13.5px;line-height:1.7;animation:fadeUp .3s;
}
.verdict .vt{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:8px;font-weight:600}
.verdict.good{background:color-mix(in srgb,var(--teal) 10%,transparent);border-color:var(--teal)}
.verdict.good .vt{color:var(--teal)}
.verdict.bad{background:color-mix(in srgb,var(--coral) 10%,transparent);border-color:var(--coral)}
.verdict.bad .vt{color:var(--coral)}
.verdict.meh{background:color-mix(in srgb,var(--amber) 10%,transparent);border-color:var(--amber)}
.verdict.meh .vt{color:var(--amber)}
.verdict .cite{display:block;margin-top:9px;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}

/* ---------------- radar mission ---------------- */
.radar-wrap{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.radar-wrap{grid-template-columns:1fr}}
.radar-box{display:grid;place-items:center;padding:10px}
.radar-box svg{width:100%;max-width:210px}
.rsweep{transform-origin:100px 100px;animation:spin 3.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rblip{opacity:0;animation:blip 3.4s linear infinite}
@keyframes blip{0%,6%{opacity:1}55%,100%{opacity:0}}

.flagcard{
  background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--border2);
  border-radius:14px;padding:26px 24px;min-height:150px;display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;animation:dealIn .4s cubic-bezier(.2,1.1,.35,1);
}
@keyframes dealIn{from{opacity:0;transform:translateY(20px) rotate(-1.5deg) scale(.97)}to{opacity:1;transform:none}}
.flagcard .obs{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;margin-bottom:11px}
.flagcard .txt{font-size:16.5px;line-height:1.6;font-weight:500}
.flagcard .wm{position:absolute;right:-14px;bottom:-26px;font-family:var(--mono);font-size:82px;font-weight:700;opacity:.045;letter-spacing:-.04em}

.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}
.catbtn{
  text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 15px;
  cursor:pointer;transition:.16s;font-family:var(--sans);color:var(--text);
}
.catbtn:hover:not(:disabled){border-color:var(--blue);background:var(--panel2);transform:translateY(-2px)}
.catbtn:disabled{cursor:default}
.catbtn .cl{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em;display:block;margin-bottom:4px}
.catbtn .cn{font-size:13px;font-weight:600;line-height:1.35}
.catbtn.right{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
.catbtn.wrong{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,transparent)}
.catbtn.dimmed{opacity:.3}

.combo{font-family:var(--mono);font-size:12px;color:var(--amber);transition:.2s}
.combo.hot{animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.timerbar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .1s linear}
.timerbar.danger i{background:var(--coral)}

/* ---------------- console mission ---------------- */
.con-wrap{display:grid;grid-template-columns:262px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.con-wrap{grid-template-columns:1fr}}
.dossier h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.field{margin-bottom:13px}
.field .fl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.field .fv{font-family:var(--mono);font-size:12.5px;line-height:1.5}
.risktag{display:inline-block;font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase}
.risktag.low{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal)}
.risktag.med{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.risktag.high{background:color-mix(in srgb,var(--coral) 15%,transparent);color:var(--coral)}

.case-wrap{position:relative;overflow:hidden}
.case-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.case-id{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.amtrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.amt{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.02em}
.amt .cur{font-size:15px;color:var(--muted);margin-right:6px}
.ttype{font-size:12.5px;color:var(--muted);margin-top:3px}
.thermo{width:100%;margin:14px 0 18px}
.thermo svg{width:100%;height:52px}

.drow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.drow:last-child{border-bottom:none}
.drow .k{color:var(--muted);flex:none}
.drow .v{font-family:var(--mono);text-align:right}
.narr{background:var(--panel2);border-radius:9px;padding:14px 16px;font-size:13px;line-height:1.7;margin:16px 0 18px;border-left:2px solid var(--border2)}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.acts{grid-template-columns:1fr}}
.act{
  font-family:var(--sans);font-weight:600;font-size:13px;padding:14px 8px;border-radius:9px;
  border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;transition:.16s;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.act small{font-weight:400;font-size:10px;color:var(--dim);letter-spacing:.04em}
.act:hover:not(:disabled){transform:translateY(-2px)}
.act[data-a=clear]:hover:not(:disabled){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
.act[data-a=flag]:hover:not(:disabled){border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.act[data-a=escalate]:hover:not(:disabled){border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,transparent)}
.act:disabled{opacity:.32;cursor:default}
.act.picked{opacity:1!important;border-width:2px}

.reasons{display:none;margin-top:16px;padding:15px;background:var(--panel2);border-radius:10px;border:1px dashed var(--border2);animation:fadeUp .3s}
.reasons.show{display:block}
.reasons .h{font-size:12px;color:var(--muted);margin-bottom:11px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-family:var(--mono);
  padding:8px 13px;margin:0 7px 7px 0;border-radius:7px;border:1px solid var(--border2);
  background:var(--panel);cursor:pointer;transition:.15s;user-select:none;
}
.chip:hover{border-color:var(--amber)}
.chip.on{border-color:var(--amber);color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.chip.correct-r{border-color:var(--teal);color:var(--teal)}
.chip.missed{border-color:var(--teal);border-style:dashed;color:var(--teal);opacity:.75}

.stamp{
  position:absolute;top:38%;left:50%;

  transition:transform .4s cubic-bezier(.15,1.5,.4,1),opacity .2s;
}

.stamp.good{color:var(--teal);border-color:var(--teal);background:rgba(43,217,176,.09)}

.tt-wrap{max-width:760px;margin:0 auto}
.gauge{display:grid;place-items:center;margin-bottom:6px}
.gauge svg{width:100%;max-width:390px;height:auto}
.tt-ctx{text-align:center;margin-bottom:20px}
.tt-ctx .who{font-size:14px;font-weight:600}
.tt-ctx .note{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 15px;
  cursor:pointer;transition:.16s;text-align:left;font-family:var(--sans);color:var(--text);
}
.opt:hover:not(:disabled){border-color:var(--violet);transform:translateY(-2px);background:var(--panel2)}
.opt:disabled{cursor:default}
.opt .ok{font-family:var(--mono);font-size:13px;font-weight:600;display:block}
.opt .od{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.opt.right{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
.opt.wrong{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,transparent)}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.vcard{perspective:1100px;height:186px;cursor:pointer}

}

.vback{background:var(--panel3);transform:rotateY(180deg);justify-content:center}

.vback .src{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:10px;letter-spacing:.05em}
.vseen{position:absolute;top:12px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--teal);opacity:0;transition:.3s}

/* ---------------- results ---------------- */
.res{text-align:center;padding:16px 0}

.res .grade{font-size:15px;font-weight:600;margin-top:10px}
.res .blurb{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:56ch;margin-inline:auto;line-height:1.65}
.xpgain{display:inline-flex;align-items:center;gap:7px;margin-top:18px;background:color-mix(in srgb,var(--teal) 12%,transparent);border:1px solid var(--teal);color:var(--teal);font-family:var(--mono);font-size:13px;padding:8px 18px;border-radius:30px;animation:pop .5s}
.brk{max-width:460px;margin:26px auto 0;text-align:left}
.brk-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.brk-row .bl{flex:1;font-size:13px;text-transform:capitalize}
.brk-row .bb{width:96px;height:6px;background:var(--panel3);border-radius:4px;overflow:hidden}

.brk-row .bv{font-family:var(--mono);font-size:12px;width:42px;text-align:right;color:var(--muted)}
.res-actions{display:flex;gap:11px;justify-content:center;margin-top:28px;flex-wrap:wrap}

/* ---------------- certificate ---------------- */
.cert{background:linear-gradient(150deg,#FFFDF6,#FFF8E8);border:1px solid var(--gold);border-radius:16px;padding:40px;text-align:center;position:relative;overflow:hidden;max-width:660px;margin:0 auto}
.cert::before{content:'';position:absolute;inset:9px;border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);border-radius:10px;pointer-events:none}

.cert .ct{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}

.cert .cn{font-size:14px;color:var(--muted);line-height:1.7;max-width:46ch;margin-inline:auto}
.cert .cline{display:flex;justify-content:center;gap:34px;margin-top:26px;padding-top:22px;border-top:1px solid color-mix(in srgb,var(--gold) 20%,transparent);flex-wrap:wrap}
.cert .cline div{font-family:var(--mono);font-size:12px}
.cert .cline span{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;font-family:var(--sans)}

/* ---------------- badges ---------------- */
.badgerow{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.badge{width:66px;text-align:center;opacity:.24;transition:.3s;filter:grayscale(1)}
.badge.earned{opacity:1;filter:none}
.badge svg{width:48px;height:48px}
.badge .bn{font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.3}

/* ---------------- toast ---------------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:10px;align-items:flex-end}

}

@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}

.note{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:26px;text-align:center;border-top:1px solid var(--border);padding-top:18px}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

/* ================= cinematic layer ================= */
#cine{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.actor.right{right:2vw;transform:translateX(60px)}

/* speech bubble */
.cbubble{position:relative;background:var(--surface);border-radius:16px;
  padding:20px 24px;font-size:16px;line-height:1.65;color:var(--ink);

.cbubble .who{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cbubble .caret{display:inline-block;width:2px;height:1em;background:var(--ink);

@keyframes blink{50%{opacity:0}}
@keyframes bpop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* answer list */

.crow{display:flex;align-items:center;gap:14px;text-align:left;width:100%;

.crow.shown{opacity:1;transform:none;transition:opacity .3s ease,transform .3s ease}
.crow:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--grad-b)}
.crow .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;

.crow:hover:not(:disabled) .ic{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal)}

.crow.good .ic{background:var(--teal);color:#fff}
.crow.meh{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,#fff)}
.crow.meh .ic{background:var(--amber);color:#fff}
.crow.bad{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,#fff)}
.crow.bad .ic{background:var(--coral);color:#fff}
.crow.faded{opacity:.4}
.crow:disabled{cursor:default}

.cnext{position:relative;margin-left:auto;display:inline-flex;align-items:center;gap:9px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#0C2A25;font-weight:700;
  font-size:14px;padding:13px 26px;border:none;border-radius:10px;cursor:pointer;
  box-shadow:var(--shadow-lg);transition:.16s}
.cnext:hover{filter:brightness(1.06);transform:translateY(-1px)}

/* countdown ring */
.ring{position:relative;width:82px;height:82px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .trk{fill:rgba(255,255,255,.75);stroke:var(--line);stroke-width:7}
.ring .prg{fill:none;stroke:var(--teal);stroke-width:7;stroke-linecap:round;
  transition:stroke-dashoffset .1s linear,stroke .3s ease}
.ring.danger .prg{stroke:var(--coral)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink)}
.ring.danger .lbl{color:var(--coral)}

/* scene-mode screens sit above the cinematic layer */
body.scene #stage{position:relative;z-index:2;max-width:1180px}
body.scene .panel,body.scene .hudpill,body.scene .mhead .back{
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px)}
.skipbtn{position:fixed;right:20px;bottom:20px;z-index:130;background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:30px;
  padding:9px 18px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);
  cursor:pointer;box-shadow:var(--shadow)}
.skipbtn:hover{color:var(--ink)}
</style>
</head>

<script>
/* =====================================================================

/* ---------------------------------------------------------------
   1. THRESHOLDS  (Content notes §2 — the deterministic logic layer)
   --------------------------------------------------------------- */
const RULES = {
  CTR_CASH: 2000000,       // cash transactions >= PKR 2,000,000 -> CTR, regardless of suspicion
  WALKIN_VERIFY: 500000,   // occasional/walk-in cash >= PKR 500,000 -> identity verification
  STR_MIN: 0,              // no minimum; includes attempted transactions
  BO_STANDARD: 20,         // beneficial ownership threshold %
  BO_EDD: 10,
  RETENTION_YEARS: 10
};
const PKR = n => 'PKR ' + n.toLocaleString('en-US');

/* ---------------------------------------------------------------
   2. RED-FLAG LIBRARY  (Content notes §3 — Annexure-II categories)
   --------------------------------------------------------------- */
const CATS = {
  A:{key:'A', name:'Inconsistent with customer profile', color:'#3B7DE8'},
  B:{key:'B', name:'Large cash activity',                color:'#E39A0C'},
  C:{key:'C', name:'Cross-border / wire concerns',       color:'#8B5CF6'},

const FLAGS = [
  {c:'A', t:'The customer moves funds constantly between several accounts they own, holding far more liquidity than their stated profile would explain.'},
  {c:'A', t:'Funds are withdrawn almost immediately after being deposited, with no plausible business reason offered.'},
  {c:'A', t:'A run of cash deposits at PKR 490,000 each — every one landing just below a reporting threshold.'},
  {c:'A', t:'Heavy cash turnover in an account whose declared business would normally settle by cheque or banking instrument.'},
  {c:'B', t:'The customer exchanges a large volume of small-denomination notes for high-denomination notes.'},
  {c:'B', t:'A large cash withdrawal from an account that sat dormant until an unexpected large credit arrived.'},
  {c:'B', t:'Several individuals queue at separate tellers at the same moment, each depositing large cash amounts.'},
  {c:'B', t:'A first-time customer wants to convert a bulk of cash without any account relationship being established.'},
  {c:'C', t:'A wire transfer to a jurisdiction of concern, with no business reason the customer can articulate.'},
  {c:'C', t:'A large incoming wire arrives with no logical business purpose for an account of this type.'},
  {c:'C', t:'A run of outgoing wires, each deliberately kept small enough to stay under reporting thresholds.'},
  {c:'C', t:'An incoming transfer arrives missing complete originator and beneficiary information.'},
  {c:'D', t:'Collateral is pledged by a third party who has no discernible relationship with the borrower.'},
  {c:'D', t:'A payment order carries inaccurate information about who actually placed it.'},
  {c:'D', t:'A nominee/trustee account is operating in a way inconsistent with the customer\u2019s stated business.'},
  {c:'D', t:'A guarantee is offered by an unknown party with no visible link to the transaction being financed.'},

/* ---------------------------------------------------------------
   3. GLOSSARY / VAULT  (Content notes §1 + §2 + §5)
   --------------------------------------------------------------- */
const GLOSSARY = [
  {k:'CDD', t:'KYC / Customer Due Diligence', d:'Identify the customer, verify identity against reliable documents or sources, understand the purpose of the relationship, and monitor the account on an ongoing basis for consistency with the known profile.', s:'Notes §1'},
  {k:'BO', t:'Beneficial Owner', d:'The real natural person who ultimately owns or controls the customer, or on whose behalf a transaction is conducted — not necessarily the named account holder. 20% shareholding under standard CDD, 10% under EDD.', s:'Notes §1, §4'},
  {k:'EDD', t:'Enhanced Due Diligence', d:'Extra scrutiny above standard CDD for higher-risk customers, products or geographies: additional detail on occupation, source of funds and wealth, senior management sign-off, and more frequent monitoring.', s:'Notes §1'},
  {k:'PEP', t:'Politically Exposed Person', d:'Someone holding a prominent public role — head of state, senior politician, judge, senior military or state-enterprise executive — plus close associates and family. Junior officials are not PEPs.', s:'Notes §1'},
  {k:'STR', t:'Suspicious Transaction Report', d:'Filed with the FMU regardless of amount, whenever a transaction is suspected of being linked to money laundering or terrorism financing — including attempted transactions that were never completed.', s:'Notes §1, §5'},
  {k:'CTR', t:'Currency Transaction Report', d:'Filed for cash transactions of PKR 2,000,000 and above. Mandatory on the amount alone — no suspicion is required and a plausible explanation does not remove the obligation.', s:'Notes §2'},
  {k:'PKR 500K', t:'Walk-in Verification Threshold', d:'Identity verification is required for occasional or walk-in customers conducting cash transactions of PKR 500,000 or above — whether a single transaction or several that appear to be linked.', s:'Notes §2'},
  {k:'NPO', t:'NGO / NPO / Charity Accounts', d:'Automatic EDD and senior management approval, regardless of transaction size. The risk attaches to the customer type itself, not to the amount being moved.', s:'Notes §2'},
  {k:'10 YRS', t:'Record Retention', d:'Transaction records are kept for 10 years from the transaction date. Identification records are kept for 10 years after the relationship ends.', s:'Notes §2'},
  {k:'TIP-OFF', t:'Prohibition on Tipping Off', d:'Employees are strictly prohibited from disclosing to a customer that an STR has been or is being filed. Tipping off is itself a disciplinable and reportable offence.', s:'Notes §5'},
  {k:'FMU', t:'Financial Monitoring Unit', d:'The authority STRs are filed with. The basis for deciding to file — or not to file — must be documented either way, and the reporting duty cannot be delegated to outsourced staff.', s:'Notes §5'},

];

/* ---------------------------------------------------------------
   4. CDD DIALOGUE SIMULATION  (Content notes §4 + §5)
   --------------------------------------------------------------- */
const CDD_STEPS = ['Identify','Verify','Ownership','Risk','Monitor'];

const DIALOGUE = {
  persona:{name:'Danish Raza', role:'Walk-in — new account application', seed:7},
  intro:'A man approaches your desk at the branch. He wants to open a current account for a private limited company registered three weeks ago.',

      choices:[

         f:'Partly right — you will get there, but identification works best as a deliberate, complete step. Leaving it open-ended risks gaps in exactly the fields (turnover, source of earnings) you will need later.', cite:'CDD flow — step 1 (Identify)'}
      ]
    },
    {
      step:1,

      choices:[
        {t:'I do have to verify it against NADRA biometrically before the relationship can be established. It only takes a moment.', v:'good',

  {k:'STR',    n:'File an STR',        d:'Suspicious Transaction Report — FMU'},
  {k:'EDD',    n:'Enhanced due diligence', d:'Senior management approval required'}
];

/* Deterministic rule engine — the "simulator logic hook" from the notes */
function resolveObligation(tx){
  if (tx.suspicion) return {k:'STR', why:'Suspicion is present, so an STR is filed regardless of amount — there is no minimum, and the duty extends to attempted transactions. Suspicion outranks every other trigger here.'};
  if (tx.party === 'pep') return {k:'EDD', why:'A PEP relationship requires senior management approval, documented source of wealth and enhanced ongoing monitoring. The obligation attaches to who the customer is, not to the size of this transaction.'};
  if (tx.party === 'npo') return {k:'EDD', why:'NGO, NPO and charity accounts carry automatic EDD and senior management approval regardless of transaction size.'};
  if (tx.cash && tx.amount >= RULES.CTR_CASH) return {k:'CTR', why:'A cash transaction of ' + PKR(tx.amount) + ' is at or above the PKR 2,000,000 threshold, so a Currency Transaction Report is mandatory on the amount alone — no suspicion needed.'};
  if (tx.cash && tx.party === 'walkin' && tx.amount >= RULES.WALKIN_VERIFY) return {k:'VERIFY', why:'A walk-in customer conducting a cash transaction of ' + PKR(tx.amount) + ' is at or above the PKR 500,000 mark, so identity verification is required before processing.'};
  return {k:'NONE', why:'No threshold is crossed and nothing suspicious is present: ' + PKR(tx.amount) + (tx.cash ? ' in cash' : ' by transfer') + ' for an established customer. Ordinary monitoring continues.'};
}

/* ---- semicircular gauge for the threshold trainer ---- */
function gaugeSVG(amount, cash){
  const max = 3000000;
  const frac = Math.min(1, amount/max);
  const ang = -180 + frac*180;
  const r = 118, cx = 160, cy = 140;
  const rad = a => (a*Math.PI)/180;
  const px = (a,rr) => cx + rr*Math.cos(rad(a));
  const py = (a,rr) => cy + rr*Math.sin(rad(a));
  const arc = (a1,a2,rr,col,w) =>
    `<path d="M${px(a1,rr).toFixed(1)} ${py(a1,rr).toFixed(1)} A${rr} ${rr} 0 ${a2-a1>180?1:0} 1 ${px(a2,rr).toFixed(1)} ${py(a2,rr).toFixed(1)}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const aVerify = -180 + (RULES.WALKIN_VERIFY/max)*180;
  const aCtr = -180 + (RULES.CTR_CASH/max)*180;
  return `
  <svg viewBox="0 0 320 176" xmlns="http://www.w3.org/2000/svg">
    ${arc(-180,-0.01,r,'#DCE6EF',13)}
    ${cash ? arc(-180,aVerify,r,'#0FA98A',13) + arc(aVerify,aCtr,r,'#E39A0C',13) + arc(aCtr,-0.01,r,'#E2493C',13)

      <text x="18" y="164">0</text>
      <text x="${(px(aVerify,r)-16).toFixed(1)}" y="${(py(aVerify,r)-14).toFixed(1)}">500K</text>
      <text x="${(px(aCtr,r)-8).toFixed(1)}" y="${(py(aCtr,r)-14).toFixed(1)}">2M</text>
      <text x="282" y="164">3M+</text>
    </g>
    <g transform="rotate(${ang.toFixed(2)} ${cx} ${cy})">
      <path d="M${cx} ${cy} L${cx+r-16} ${cy-4} L${cx+r-16} ${cy+4} Z" fill="#10202F"/>
    </g>
    <circle cx="${cx}" cy="${cy}" r="9" fill="#10202F" stroke="#FFFFFF" stroke-width="2"/>
    <text x="${cx}" y="${cy-30}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" font-weight="600" fill="#10202F">${PKR(amount)}</text>

/* ---- ambient background canvas ---- */
(function ambient(){
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let w, h, dots = [], glyphs = [];
  const SYM = ['\u20A8','$','\u20AC','\u00A3','\u00A5'];
  function size(){
    w = cv.width = innerWidth; h = cv.height = innerHeight;
  }
  function build(){
    dots = [];
    const n = Math.min(70, Math.round(w*h/26000));
    for (let i=0;i<n;i++) dots.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5+.4, vy:-(Math.random()*.14+.03), a:Math.random()*.4+.1});
    glyphs = [];
    for (let i=0;i<9;i++) glyphs.push({x:Math.random()*w, y:Math.random()*h, s:Math.random()*16+13, vy:-(Math.random()*.2+.07), a:Math.random()*.05+.02, c:SYM[i%SYM.length]});
  }
  function frame(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#3B7DE8';
    dots.forEach(d=>{
      d.y += d.vy; if (d.y < -6){ d.y = h+6; d.x = Math.random()*w; }
      ctx.globalAlpha = d.a; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.fill();
    });
    glyphs.forEach(g=>{
      g.y += g.vy; if (g.y < -40){ g.y = h+40; g.x = Math.random()*w; }
      ctx.globalAlpha = g.a * 2.2; ctx.font = g.s+'px IBM Plex Mono, monospace'; ctx.fillStyle = '#8B5CF6';
      ctx.fillText(g.c, g.x, g.y);
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  addEventListener('resize', ()=>{ size(); build(); });
  size(); build(); frame();
})();

/* ---- confetti burst ---- */
function confetti(){
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#0FA98A','#3B7DE8','#8B5CF6','#E39A0C','#C084FC','#34E0C0'];
  const ps = [];
  for (let i=0;i<130;i++) ps.push({
    x: innerWidth/2 + (Math.random()-.5)*260, y: innerHeight*0.34,
    vx:(Math.random()-.5)*11, vy:Math.random()*-13-3,
    w:Math.random()*7+3, h:Math.random()*4+2,
    r:Math.random()*6, vr:(Math.random()-.5)*.35,
    c:cols[(Math.random()*cols.length)|0], life:1
  });
  let t = 0;
  (function run(){
    ctx.clearRect(0,0,cv.width,cv.height);
    t++;
    ps.forEach(p=>{
      p.vy += .34; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .0075;
      ctx.save(); ctx.globalAlpha = Math.max(0,p.life);
      ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if (t < 210) requestAnimationFrame(run); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}

function rankOf(xp){
  let r = RANKS[0];
  RANKS.forEach(x=>{ if (xp >= x.min) r = x; });

  S.xp += n; save(); renderRank();

  if (after.n !== before.n){

  } else if (label){
    toast('+' + n + ' XP', label);
  }
}
function awardBadge(id){
  if (S.badges.includes(id)) return;
  S.badges.push(id); save();
  const b = BADGES.find(x=>x.id===id);
  beep('good');

/* ---- sound (WebAudio, no files) ---- */
let AC = null;
function beep(kind){
  if (S.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {
      good:[[660,0],[880,.08]], bad:[[220,0],[165,.1]], tick:[[520,0]],
      pick:[[440,0]], rank:[[523,0],[659,.09],[784,.18],[1047,.27]], done:[[587,0],[784,.11]]
    }[kind] || [[440,0]];
    seq.forEach(([f,d])=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind==='bad' ? 'sawtooth' : 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, AC.currentTime+d);
      g.gain.linearRampToValueAtTime(.055, AC.currentTime+d+.012);
      g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+d+.2);
      o.connect(g); g.connect(AC.destination);
      o.start(AC.currentTime+d); o.stop(AC.currentTime+d+.22);
    });
  }catch(e){}
}

    if (b && !b.disabled){ b.click(); }
  };
}

const custArt = seed => CUST_ART[Math.abs(seed|0) % CUST_ART.length];

/* ---- background ---- */
let _bgTop = false, _bgKey = null;
function setScene(key){
  const scrim = document.getElementById('cscrim');
  if (!key){
    _bgKey = null;
    document.getElementById('cbgA').classList.remove('in');
    document.getElementById('cbgB').classList.remove('in');
    scrim.style.opacity = 0;
    document.body.classList.remove('scene');
    return;
  }
  document.body.classList.add('scene');
  scrim.style.opacity = 1;
  if (key === _bgKey) return;
  _bgKey = key;
  const incoming = document.getElementById(_bgTop ? 'cbgA' : 'cbgB');
  const outgoing = document.getElementById(_bgTop ? 'cbgB' : 'cbgA');
  _bgTop = !_bgTop;
  incoming.src = ART[key];
  incoming.classList.add('in');
  outgoing.classList.remove('in');
}

/* ---- actors ---- */
const _actors = {};
function clearActors(){
  Object.keys(_actors).forEach(k=>_actors[k].exit());
}
function actor(artKey, side, opts){
  opts = opts || {};
  const id = opts.id || side;
  if (_actors[id]){ _actors[id].mood(artKey); return _actors[id]; }
  const el = document.createElement('img');
  el.className = 'actor ' + side;
  el.alt = '';
  el.src = ART[artKey];
  document.getElementById('actors').appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.classList.add('in');
    setTimeout(()=>el.classList.add('idle'), 500);
  }));
  const handle = {
    el,
    mood(nextKey){
      if (el.src.endsWith(ART[nextKey])) return;
      el.style.opacity = 0;
      setTimeout(()=>{ el.src = ART[nextKey]; el.style.opacity = 1; }, 200);
    },
    exit(){
      el.classList.remove('in','idle');
      setTimeout(()=>el.remove(), 450);
      delete _actors[id];
    }
  };
  _actors[id] = handle;
  return handle;
}

/* ---- typed speech ---- */
let _typing = null;
function say(name, text, opts){
  opts = opts || {};
  const host = opts.el || document.getElementById('bubbleslot');
  const speed = opts.speed == null ? 18 : opts.speed;
  return new Promise(resolve=>{
    const b = document.createElement('div');
    b.className = 'cbubble';
    b.innerHTML = (name ? `<span class="who">${name}</span>` : '') +
                  `<span class="body"></span><span class="caret"></span>`;
    if (opts.append) host.appendChild(b); else { host.innerHTML = ''; host.appendChild(b); }
    const body = b.querySelector('.body');
    const caret = b.querySelector('.caret');
    let i = 0;
    const done = ()=>{
      if (_typing){ clearInterval(_typing); _typing = null; }
      body.textContent = text;
      caret.remove();
      b.onclick = null;
      resolve();
    };
    b.onclick = done;
    if (speed === 0){ done(); return; }
    _typing = setInterval(()=>{
      if (!b.isConnected){ done(); return; }
      body.textContent = text.slice(0, ++i);
      if (i >= text.length) done();
    }, speed);
    activeTimers.push(_typing);
  });
}

/* ---- staged choices ---- */
function choices(items, opts){
  opts = opts || {};
  const host = opts.el || document.getElementById('choiceslot');
  return new Promise(resolve=>{
    host.innerHTML =
      (opts.prompt === false ? '' : `<div class="cprompt">${opts.prompt || 'Select The Most Effective Answer.'}</div>`) +
      `<div class="cchoices" id="crows">` +
      items.map((c,ix)=>`<button class="crow" data-i="${ix}">
        <span class="ic">${c.ic == null ? ix+1 : c.ic}</span><span>${c.t}</span></button>`).join('') +
      `</div>`;
    const rows = [...host.querySelectorAll('.crow')];
    rows.forEach((r,ix)=>setTimeout(()=>r.classList.add('shown'), 60*ix));
    setKeys(numberKeys(()=>rows));
    rows.forEach(r=>{ r.onclick = ()=>{ beep('pick'); resolve(parseInt(r.dataset.i,10)); }; });
  });
}

/* ---- module briefing ---- */
function brief(m, bgKey, artKey, name, lines){
  return new Promise(resolve=>{
    setKeys(null);
    clearActors();
    setScene(bgKey);
    actor(artKey, 'right', {id:'mentor'});
    go(`${missionHead(m,'')}
      <div style="max-width:min(100%,700px);padding:4vh 0 0">
        <div id="bubbleslot"></div>
        <div id="ctaslot" style="display:flex;margin-top:20px"></div>
      </div>`);
    bindBack();
    const nav = _nav;
    (async ()=>{
      for (const line of lines){
        if (nav !== _nav) return;
        await say(name, line, {append:true});
      }
      if (nav !== _nav) return;
      const slot = document.getElementById('ctaslot');
      if (!slot) return;
      slot.innerHTML =
        `<button class="cnext" id="startbtn">Start ${icon('arrow')}</button>`;
      const sb = document.getElementById('startbtn');
      sb.onclick = ()=>{ beep('pick'); resolve(); };
      setKeys(e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); sb.click(); } });
    })();
  });
}

/* ---- countdown ring ---- */
const RING_C = 2 * Math.PI * 34;
function ringHTML(id){
  return `<div class="ring" id="${id}">
    <svg viewBox="0 0 82 82">
      <circle class="trk" cx="41" cy="41" r="34"/>
      <circle class="prg" cx="41" cy="41" r="34"
        stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="0"/>
    </svg>
    <div class="lbl">0:00</div>
  </div>`;
}
function ringSet(id, frac, secs){
  const w = document.getElementById(id);
  if (!w) return;
  frac = Math.max(0, Math.min(1, frac));
  w.querySelector('.prg').style.strokeDashoffset = (RING_C * (1 - frac)).toFixed(1);
  const s = Math.max(0, Math.ceil(secs));
  w.querySelector('.lbl').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  w.classList.toggle('danger', frac <= 0.28);
}

/* =====================================================================
   MODULE 01 — CUSTOMER ONBOARDING (branching CDD dialogue)
   ===================================================================== */
function missionOnboarding(){
  const m = MISSIONS.find(x=>x.id==='onboarding');
  const P = DIALOGUE.persona;
  let custA = null;
  let mentorA = null;
  let seq = DIALOGUE.beats.slice();
  let i = 0, pts = 0, max = 0, tipOffs = 0, criticals = 0, branch = null;
  let integrity = 100, rapport = 62;
  let log = [];
  const stepScores = {};

  function mood(){
    if (rapport < 35) return 'annoyed';
    if (rapport < 52) return 'tense';
    if (rapport > 78) return 'pleased';
    return 'neutral';
  }

  function draw(){
    const b = seq[i];
    const hud = `<div class="hudpill"><span class="lbl">Decision</span><b>${i+1}/${seq.length}</b></div>`;
    go(`
      ${missionHead(m, hud)}
      <div class="progline"><i style="width:${(i/seq.length*100).toFixed(1)}%"></i></div>
      <div class="cdd-steps">
        ${CDD_STEPS.map((s,ix)=>`<div class="cdd-step ${ix===b.step?'on':ix<b.step?'done':''}">${ix+1}. ${s}</div>`).join('')}
      </div>
      <div class="panel" style="max-width:min(100%,760px);margin-left:auto">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
          <div>
            <div style="font-size:15px;font-weight:600;color:var(--ink)">${P.name}</div>
            <div style="font-size:12px;color:var(--muted)">${P.role}</div>
          </div>
          <div style="flex:1"></div>
          <div class="meter" style="width:150px;margin:0">
            <div class="mrow"><span>File integrity</span><span style="color:${integrity>=80?'var(--teal)':integrity>=50?'var(--amber)':'var(--coral)'}">${integrity}%</span></div>
            <div class="bar"><i style="width:${integrity}%;background:${integrity>=80?'var(--teal)':integrity>=50?'var(--amber)':'var(--coral)'}"></i></div>
          </div>
          <div class="meter" style="width:150px;margin:0">
            <div class="mrow"><span>Rapport</span><span style="color:var(--blue)">${rapport}%</span></div>
            <div class="bar"><i style="width:${rapport}%;background:var(--blue)"></i></div>
          </div>
        </div>
        ${b.sys ? `<div class="bubble sys"><span class="who">Eleven days later</span>${b.sys}</div>` : ''}
        ${i===0 ? `<div class="bubble sys"><span class="who">Branch floor</span>${DIALOGUE.intro}</div>` : ''}
        <div id="bubbleslot"></div>
        ${b.note ? `<div class="narr" style="margin:14px 0 0"><b style="color:var(--amber);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px">On the file</b>${b.note}</div>` : ''}
        <div id="choiceslot" style="margin-top:18px"></div>
        <div id="fbslot"></div>
      </div>
    `);
    bindBack();
    if (custA) custA.mood(custArt(P.seed));
    const nav = _nav;
    (async ()=>{
      await say(P.name, b.say);
      if (nav !== _nav) return;
      const ix = await choices(b.choices.map(c=>({t:c.t})));
      if (nav !== _nav) return;
      const btn = document.querySelector(`#crows .crow[data-i="${ix}"]`);
      answer(ix, btn);
    })();
  }

  function answer(ix, btn){
    const b = seq[i], c = b.choices[ix];
    const gain = c.v==='good' ? 2 : c.v==='meh' ? 1 : 0;
    pts += gain; max += 2;
    stepScores[CDD_STEPS[b.step]] = stepScores[CDD_STEPS[b.step]] || {p:0,m:0};
    stepScores[CDD_STEPS[b.step]].p += gain;
    stepScores[CDD_STEPS[b.step]].m += 2;

    if (c.v === 'good'){ integrity = Math.min(100, integrity + 2); rapport = Math.max(0, rapport - 4); beep('good'); }
    else if (c.v === 'meh'){ integrity = Math.max(0, integrity - 7); rapport += 3; beep('pick'); }
    else { integrity = Math.max(0, integrity - 18); rapport += 8; criticals++; beep('bad'); }
    rapport = Math.max(0, Math.min(100, rapport));
    if (c.v === 'bad' && /tipping off/i.test(c.cite)) tipOffs++;

    document.querySelectorAll('#crows .crow').forEach(el=>{
      el.disabled = true;
      el.onclick = null;
      if (el !== btn) el.classList.add('faded');
    });
    btn.classList.add(c.v);
    mentorA = actor(c.v === 'good' ? 'elena-explain' : 'elena-concern', 'right', {id:'mentor'});

    document.getElementById('fbslot').innerHTML = `
      <div class="verdict ${c.v}">
        <span class="vt">${c.v==='good'?'Correct handling':c.v==='meh'?'Partially correct':'Regulatory breach'}</span>
        ${c.f}
        <span class="cite">Reference \u2014 ${c.cite}</span>
      </div>
      <div style="display:flex;margin-top:14px"><button class="cnext" id="nextbtn">${i+1>=seq.length && branchResolved()?'See assessment':'Next'} ${icon('arrow')}</button></div>`;

    if (c.branch && !branch){ branch = c.branch; seq = seq.concat(DIALOGUE[branch]); }

    const nb = document.getElementById('nextbtn');
    setKeys(e=>{ if (e.key==='Enter'||e.key===' ') { e.preventDefault(); nb.click(); } });
    nb.onclick = ()=>{ i++; if (i >= seq.length) finish(); else draw(); };
  }
  function branchResolved(){ return branch != null; }

  function finish(){
    clearActors();
    const pct = (pts/max)*100;
    if (criticals === 0) awardBadge('onboarding');
    if (tipOffs === 0) awardBadge('clean');
    const xp = Math.round(pts * 9);
    const brk = Object.keys(stepScores).map(k=>({
      label:'Step \u2014 ' + k,
      pct:Math.round(stepScores[k].p/stepScores[k].m*100),
      val:stepScores[k].p + '/' + stepScores[k].m
    }));
    results({
      id:'onboarding', pct, xp, breakdown:brk, brkTitle:'By CDD step',
      headline: pts + '/' + max + ' decision points',
      extra:`<div style="max-width:520px;margin:24px auto 0;text-align:left">
        <div class="drow"><span class="k">Path taken at risk assessment</span><span class="v" style="color:${branch==='edd'?'var(--teal)':'var(--coral)'}">${branch==='edd'?'Enhanced due diligence':'Standard CDD \u2014 escalated back later'}</span></div>
        <div class="drow"><span class="k">Tipping-off breaches</span><span class="v" style="color:${tipOffs?'var(--coral)':'var(--teal)'}">${tipOffs}</span></div>
        <div class="drow"><span class="k">Final file integrity</span><span class="v">${integrity}%</span></div>
      </div>`,
      again: missionOnboarding
    });
  }

  brief(m, 'bg-branch', 'elena-explain', 'Elena Vance', [
    'There is a new relationship waiting at the counter. Your job is customer due diligence: identify them, verify the identity against a reliable source, establish who really owns the business, and then decide how much scrutiny this file needs.',
    'The customer will be helpful right up to the moment you ask something inconvenient. Remember that rapport is not what the file is judged on.'
  ]).then(()=>{
    clearActors();
    setScene('bg-branch');
    custA = actor(custArt(P.seed), 'left', {id:'cust'});
    draw();
  });
}

/* =====================================================================
   MODULE 02 — RED-FLAG RADAR (timed category sorting)
   ===================================================================== */
function missionRadar(){
  const m = MISSIONS.find(x=>x.id==='radar');
  const ROUNDS = 10, LIMIT = 18;
  const deck = shuffle(FLAGS).slice(0, ROUNDS);
  const catKeys = Object.keys(CATS);
  let i = 0, correct = 0, combo = 0, bestCombo = 0, points = 0;
  const perCat = {}; catKeys.forEach(k=>perCat[k] = {c:0,t:0});
  let marcusA = null;

  function draw(){
    const f = deck[i];
    let left = LIMIT, locked = false;
    go(`
      ${missionHead(m, `
        <div class="hudpill"><span class="lbl">Round</span><b>${i+1}/${ROUNDS}</b></div>
        <div class="hudpill"><span class="lbl">Hits</span><b style="color:var(--teal)">${correct}</b></div>
        <div class="hudpill"><span class="lbl">Combo</span><b class="combo" id="combo">\u00d7${combo||1}</b></div>`)}
      <div class="panel" style="max-width:min(100%,780px);margin-left:auto">
        <div style="display:flex;align-items:center;gap:18px;margin-bottom:16px">
          ${ringHTML('tring')}
          <div class="flagcard" style="flex:1;margin:0">
            <div class="obs">Observation ${String(i+1).padStart(2,'0')}</div>
            <div class="txt">${f.t}</div>
          </div>
        </div>
        <div id="choiceslot"></div>
        <div id="fbslot"></div>
      </div>
    `);
    bindBack();
    ringSet('tring', 1, LIMIT);
    choices(catKeys.map((k,ix)=>({t:CATS[k].name, ic:k})), {prompt:'Which red-flag family is this?'})
      .then(ix=>{ const k = catKeys[ix]; pick(k, document.querySelector(`#crows .crow[data-i="${ix}"]`)); });

    const t = setInterval(()=>{
      left -= 0.1;
      ringSet('tring', left/LIMIT, left);
      if (left <= 0){ clearInterval(t); if (!locked) pick(null); }
    }, 100);
    activeTimers.push(t);

    function pick(k, btn){
      if (locked) return;
      locked = true; clearInterval(t);
      const ok = k === f.c;
      perCat[f.c].t++;
      if (ok){
        perCat[f.c].c++; correct++; combo++; bestCombo = Math.max(bestCombo, combo);
        points += 10 + Math.min(15, (combo-1)*3) + Math.round(left/2);
        beep('good');
      } else { combo = 0; beep('bad'); }

      document.querySelectorAll('#crows .crow').forEach((el,ix)=>{
        el.disabled = true;
        el.onclick = null;
        if (catKeys[ix] === f.c) el.classList.add('good');
        else if (el === btn) el.classList.add('bad');
        else el.classList.add('faded');
      });

function missionConsole(){
  const m = MISSIONS.find(x=>x.id==='console');
  let i = 0, correct = 0, justOK = 0, justTotal = 0, points = 0;
  const perCat = {};

  function draw(){
    const c = CASES[i];
    const cust = CUSTOMERS[c.cust];
    actor(custArt(cust.seed), 'left', {id:'cust'});
    const isCash = /cash/i.test(c.type);
    let stage2 = null;   // pending action awaiting justification
    let picked = new Set();
    let locked = false;
    const chipList = c.reasons ? shuffle(c.reasons.concat(c.decoys||[])) : [];

    go(`
      ${missionHead(m, `
        <div class="hudpill"><span class="lbl">Case</span><b>${i+1}/${CASES.length}</b></div>
        <div class="hudpill"><span class="lbl">Resolved</span><b style="color:var(--teal)">${correct}</b></div>`)}
      <div class="progline"><i style="width:${(i/CASES.length*100).toFixed(1)}%"></i></div>
      <div class="con-wrap" style="max-width:min(100%,880px);margin-left:auto">
        <div class="panel dossier">
          <h4>Customer dossier</h4>
          <div class="field"><div class="fl">Account holder</div><div class="fv">${cust.name}</div></div>
          <div class="field"><div class="fl">Stated business</div><div class="fv">${cust.business}</div></div>
          <div class="field"><div class="fl">Account type</div><div class="fv">${cust.type}</div></div>
          <div class="field"><div class="fl">Expected turnover</div><div class="fv">${cust.turnover}</div></div>
          <div class="field"><div class="fl">Relationship since</div><div class="fv">${cust.since}</div></div>
          <div class="field"><div class="fl">Risk rating</div><div class="fv"><span class="risktag ${cust.risk}">${cust.risk==='low'?'Low':cust.risk==='med'?'Medium':'High'}</span></div></div>
        </div>

        <div class="panel case-wrap" id="casecard">
          <div class="stamp" id="stamp">Cleared</div>
          <div class="case-top">
            <span class="case-id">${c.id}</span>
            <span class="case-id">Queue position ${i+1} of ${CASES.length}</span>
          </div>
          <div class="amtrow">
            <div>
              <div class="amt"><span class="cur">PKR</span>${c.amount.toLocaleString('en-US')}</div>
              <div class="ttype">${c.type}</div>
            </div>
          </div>
          <div class="thermo">${thermoSVG(c.amount, isCash)}</div>
          <div>${c.details.map(d=>`<div class="drow"><span class="k">${d[0]}</span><span class="v">${d[1]}</span></div>`).join('')}</div>
          <div class="narr">${c.narrative}</div>
          <div class="acts" id="acts">
            ${Object.keys(ACTION_LABELS).map(k=>`
              <button class="act" data-a="${k}"><span>${ACTION_LABELS[k].n}</span><small>${ACTION_LABELS[k].d}</small></button>`).join('')}
          </div>
          <div class="reasons" id="reasons">
            <div class="h">Which indicator are you acting on? Select every one that applies, then confirm.</div>
            <div id="chips">${chipList.map((r,ix)=>`<span class="chip" data-r="${ix}">${r}</span>`).join('')}</div>
            <button class="btn primary wide" id="confirm" style="margin-top:12px">Confirm decision</button>
          </div>
          <div id="fbslot"></div>
        </div>
      </div>
    `);
    bindBack();

    const acts = document.getElementById('acts');
    acts.querySelectorAll('.act').forEach(b=>b.onclick = ()=>chooseAction(b.dataset.a, b));

    function chooseAction(a, btn){
      if (locked) return;
      if ((a === 'flag' || a === 'escalate') && c.reasons && !stage2){
        stage2 = a;
        acts.querySelectorAll('.act').forEach(el=>{ el.disabled = true; });
        btn.classList.add('picked');
        document.getElementById('reasons').classList.add('show');
        beep('pick');
        document.querySelectorAll('#chips .chip').forEach(ch=>{
          ch.onclick = ()=>{
            if (locked) return;
            const k = ch.dataset.r;
            if (picked.has(k)) picked.delete(k); else picked.add(k);
            ch.classList.toggle('on');
            beep('tick');
          };
        });
        document.getElementById('confirm').onclick = ()=>{
          if (!picked.size){ toast('Select an indicator', 'A flag or escalation has to name the pattern it rests on.'); return; }
          resolve(stage2);
        };
        return;
      }
      resolve(a, btn);
    }

    function resolve(a){
      locked = true;
      const ok = a === c.correct;
      if (ok) correct++;
      perCat[c.category] = perCat[c.category] || {c:0,t:0};
      perCat[c.category].t++;
      if (ok) perCat[c.category].c++;

      // justification accuracy
      let jNote = '';
      if (c.reasons){
        justTotal++;
        const correctSet = new Set(c.correctReasons.map(ix=>c.reasons[ix]));
        const chosen = [...picked].map(ix=>chipList[ix]);
        const hits = chosen.filter(x=>correctSet.has(x)).length;
        const falsePos = chosen.length - hits;
        const clean = hits === correctSet.size && falsePos === 0;
        if (clean){ justOK++; jNote = 'Justification was complete and carried no decoys.'; }
        else if (hits && !falsePos) jNote = 'Justification was on the right track but incomplete \u2014 you named ' + hits + ' of ' + correctSet.size + ' applicable indicators.';
        else if (falsePos) jNote = 'Justification included ' + falsePos + ' indicator' + (falsePos>1?'s':'') + ' that does not apply to this case.';
        else jNote = 'None of the selected indicators apply to this case.';

        document.querySelectorAll('#chips .chip').forEach(ch=>{
          const label = chipList[ch.dataset.r];
          if (correctSet.has(label)) ch.classList.add(ch.classList.contains('on') ? 'correct-r' : 'missed');
        });
      }

      points += (ok?18:0) + (c.reasons && jNote.startsWith('Justification was complete')?7:0);

      acts.querySelectorAll('.act').forEach(el=>{ el.disabled = true; });
      const chosenBtn = acts.querySelector(`.act[data-a="${a}"]`);
      if (chosenBtn) chosenBtn.classList.add('picked');
      const cf = document.getElementById('confirm');
      if (cf) cf.disabled = true;

      const st = document.getElementById('stamp');
      st.textContent = ok ? 'Correct' : 'Re-review';
      st.classList.add('show', ok?'good':'bad');
      beep(ok?'good':'bad');
      actor(ok ? 'elena-explain' : 'elena-concern', 'right', {id:'mentor'});

      document.getElementById('fbslot').innerHTML = `
        <div class="verdict ${ok?'good':'bad'}" style="margin-top:18px">
          <span class="vt">${ok?'Correct disposition':'Incorrect disposition'}</span>
          ${ok ? '' : `<b>The correct action was \u201c${ACTION_LABELS[c.correct].n}\u201d.</b> `}${c.why}
          ${jNote ? `<span style="display:block;margin-top:9px;color:var(--muted)">${jNote}</span>` : ''}
          <span class="cite">Reference \u2014 ${c.category==='baseline'?'Thresholds \u00a72 \u00b7 no indicator present':'Red-flag library \u00b7 ' + c.category.replace(/_/g,' ')}</span>
        </div>
        <div style="display:flex;margin-top:14px"><button class="cnext" id="nextbtn">${i+1>=CASES.length?'See assessment':'Next case'} ${icon('arrow')}</button></div>`;
      const nb = document.getElementById('nextbtn');
      setKeys(e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); nb.click(); } });
      nb.onclick = ()=>{ i++; if (i>=CASES.length) finish(); else draw(); };
    }
  }

  function finish(){
    clearActors();
    const pct = correct/CASES.length*100;
    const brk = Object.keys(perCat).map(k=>({
      label:k.replace(/_/g,' '),
      pct:Math.round(perCat[k].c/perCat[k].t*100),
      val:perCat[k].c + '/' + perCat[k].t
    }));
    results({
      id:'console', pct, xp:points, breakdown:brk, brkTitle:'By red-flag category \u2014 this is what an adaptive engine would route remediation on',
      headline: correct + '/' + CASES.length + ' dispositions correct',
      extra:`<div style="max-width:520px;margin:24px auto 0;text-align:left">
        <div class="drow"><span class="k">Fully correct justifications</span><span class="v">${justOK}/${justTotal}</span></div>
        <div class="drow"><span class="k">Naming the indicator matters because</span><span class="v" style="max-width:60%;font-family:var(--sans);color:var(--muted);font-size:11.5px">an STR has to record the basis for the decision</span></div>
      </div>`,
      again: missionConsole
    });
  }

  brief(m, 'bg-opsfloor', 'elena-explain', 'Elena Vance', [
    'This is the live queue. Every case in it is a real transaction waiting on a disposition from you: clear it, flag it, or escalate it.',
    'Flagging is not enough on its own. You have to name the indicator you are acting on, because an STR has to record the basis for the decision \u2014 and so does a decision not to file one.'
  ]).then(()=>{
    clearActors();
    setScene('bg-opsfloor');
    draw();
  });
}

/* =====================================================================
   MODULE 04 — THRESHOLD TRAINER (procedural drills off the rule engine)
   ===================================================================== */
const TT_NAMES = ['Bilal Ahmed','Nadia Khan','Rehan Textiles (Pvt) Ltd','Faisal Traders','Hina Aslam',
                  'Zubair Motors','Karachi Steel Co.','Ayesha Malik','Junaid Brothers','Sadia Rauf'];
const TT_NOTE = {
  none:['Regular activity, well inside the profile recorded at onboarding.',
        'Established relationship, documented purpose, nothing unusual in the pattern.',
        'Routine settlement to a counterparty this account has used for two years.'],
  verify:['Occasional customer with no account relationship at this branch.',
          'Walk-in presenting at the counter for the first time this year.',
          'No existing relationship \u2014 customer is not on file.'],
  ctr:['Explanation offered is plausible and supported by an invoice.',
       'Long-standing customer, consistent with a known seasonal cycle.',
       'Deposit matches a documented property sale.'],
  str:['Customer becomes evasive when asked about the source, and the deposits are shaped just under the verification mark.',
       'Funds were withdrawn within an hour of landing, and no business reason is offered.',
       'The customer abandoned the transaction the moment identification was requested.',
       'Several unrelated companies at the same address are moving funds through this account.'],
  pep:['Account holder is the spouse of a serving federal minister.',
       'Customer is a serving High Court judge.',
       'Signatory is the son of a provincial minister and a director of the company.'],
  npo:['Customer is a registered welfare trust operating relief programmes.',
       'Customer is a registered non-profit organisation.',
       'Charity account collecting seasonal donations.']
};
const rnd = (a,b) => Math.round((a + Math.random()*(b-a)) / 10000) * 10000;
const pick1 = a => a[(Math.random()*a.length)|0];

function makeDrill(kind){
  const who = pick1(TT_NAMES);
  switch(kind){
    case 'none': {
      const cash = Math.random() < .5;
      return {who, cash, party:'existing', suspicion:false,
              amount: cash ? rnd(40000, 460000) : rnd(120000, 1800000),
              type: cash ? 'Cash deposit' : 'Outgoing transfer', note: pick1(TT_NOTE.none)};
    }
    case 'verify':
      return {who, cash:true, party:'walkin', suspicion:false,
              amount: rnd(510000, 1900000), type:'Cash deposit', note: pick1(TT_NOTE.verify)};
    case 'ctr':
      return {who, cash:true, party: Math.random()<.5 ? 'existing' : 'walkin', suspicion:false,
              amount: rnd(2000000, 3600000),
              type: Math.random()<.5 ? 'Cash deposit' : 'Cash withdrawal', note: pick1(TT_NOTE.ctr)};
    case 'str': {
      const cash = Math.random() < .6;
      return {who, cash, party:'existing', suspicion:true,
              amount: rnd(60000, 1500000),
              type: cash ? 'Cash deposit' : 'Incoming transfer', note: pick1(TT_NOTE.str)};
    }
    case 'edd': {
      const party = Math.random() < .5 ? 'pep' : 'npo';
      return {who, cash: Math.random()<.5, party, suspicion:false,
              amount: rnd(30000, 1200000),
              type: Math.random()<.5 ? 'Cash deposit' : 'Outgoing transfer',
              note: pick1(TT_NOTE[party])};
    }
  }
}

function missionThresholds(){
  const m = MISSIONS.find(x=>x.id==='thresholds');
  const plan = shuffle(['none','none','verify','verify','ctr','ctr','ctr','str','str','edd','edd','edd']);
  const drills = plan.map(makeDrill);
  const ROUNDS = drills.length, LIMIT = 22;
  let i = 0, correct = 0, points = 0, streak = 0, bestStreak = 0;
  const perKind = {};
  let elenaA = null;

  function draw(){
    const tx = drills[i];
    const ans = resolveObligation(tx);
    let left = LIMIT, locked = false;

    go(`
      ${missionHead(m, `
        <div class="hudpill"><span class="lbl">Drill</span><b>${i+1}/${ROUNDS}</b></div>
        <div class="hudpill"><span class="lbl">Correct</span><b style="color:var(--teal)">${correct}</b></div>
        <div class="hudpill"><span class="lbl">Streak</span><b class="combo">${streak}</b></div>`)}
      <div class="panel" style="max-width:min(100%,720px)">
        <div style="display:flex;align-items:center;gap:18px;margin-bottom:14px">
          ${ringHTML('tring')}
          <div class="tt-ctx" style="flex:1;margin:0">
            <div class="who">${tx.who} \u00b7 ${tx.type}</div>
            <div class="note">${tx.note}</div>
          </div>
        </div>
        <div class="gauge">${gaugeSVG(tx.amount, tx.cash)}</div>
        <div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px;line-height:1.6">
          Name the <b style="color:var(--ink)">primary</b> obligation. Where more than one could apply the higher duty wins:
          STR &rsaquo; EDD &rsaquo; CTR &rsaquo; verify &rsaquo; none.
        </div>
        <div id="choiceslot"></div>
        <div id="fbslot"></div>
      </div>
    `);
    bindBack();
    ringSet('tring', 1, LIMIT);
    choices(TT_OPTIONS.map(o=>({t:`<b style="color:var(--ink)">${o.n}</b> \u2014 ${o.d}`})),
            {prompt:'Name the primary obligation.'})
      .then(ix=>{ const o = TT_OPTIONS[ix];
                  pick(o.k, document.querySelector(`#crows .crow[data-i="${ix}"]`)); });

    const t = setInterval(()=>{
      left -= 0.1;
      ringSet('tring', left/LIMIT, left);
      if (left <= 0){ clearInterval(t); if (!locked) pick(null); }
    }, 100);
    activeTimers.push(t);

    function pick(k, btn){
      if (locked) return;
      locked = true; clearInterval(t);
      const ok = k === ans.k;
      perKind[ans.k] = perKind[ans.k] || {c:0,t:0};
      perKind[ans.k].t++;
      if (ok){
        perKind[ans.k].c++; correct++; streak++; bestStreak = Math.max(bestStreak, streak);
        points += 12 + Math.min(12, (streak-1)*2) + Math.round(left/3);
        beep('good');
      } else { streak = 0; beep('bad'); }

      document.querySelectorAll('#crows .crow').forEach((el,ix)=>{
        el.disabled = true;
        el.onclick = null;
        if (TT_OPTIONS[ix].k === ans.k) el.classList.add('good');
        else if (el === btn) el.classList.add('bad');
        else el.classList.add('faded');
      });
      if (elenaA) elenaA.mood(ok ? 'elena-explain' : 'elena-concern');

      document.getElementById('fbslot').innerHTML = `
        <div class="verdict ${ok?'good':'bad'}" style="margin-top:16px">
          <span class="vt">${ok?'Correct':k===null?'Time expired':'Incorrect'}</span>
          ${ans.why}
          <span class="cite">Reference \u2014 Key thresholds &amp; triggers \u00a72</span>
        </div>
        <div style="display:flex;margin-top:14px"><button class="cnext" id="nextbtn">${i+1>=ROUNDS?'See assessment':'Next drill'} ${icon('arrow')}</button></div>`;
      const nb = document.getElementById('nextbtn');
      setKeys(e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); nb.click(); } });
      nb.onclick = ()=>{ i++; if (i>=ROUNDS) finish(); else draw(); };
    }
  }

  function finish(){
    clearActors();
    const pct = correct/ROUNDS*100;
    const names = {NONE:'No report required', VERIFY:'Walk-in verification', CTR:'CTR \u00b7 PKR 2M cash', STR:'STR \u00b7 any amount', EDD:'EDD \u00b7 PEP &amp; NPO'};
    const brk = Object.keys(perKind).map(k=>({
      label:names[k], pct:Math.round(perKind[k].c/perKind[k].t*100), val:perKind[k].c + '/' + perKind[k].t
    }));
    results({
      id:'thresholds', pct, xp:points, breakdown:brk, brkTitle:'By obligation type',
      headline: correct + '/' + ROUNDS + ' correct \u00b7 best streak ' + bestStreak,
      again: missionThresholds
    });
  }

  brief(m, 'bg-boardroom', 'elena-explain', 'Elena Vance', [
    'Thresholds are the part you cannot look up mid-conversation. Two million rupees in cash triggers a CTR whether or not anything looks wrong. Five hundred thousand from a walk-in triggers identity verification. An STR has no floor at all.',
    'Twelve drills, twenty-two seconds each. Where more than one obligation could apply, the higher duty wins.'
  ]).then(()=>{
    clearActors();
    setScene('bg-boardroom');
    elenaA = actor('elena-explain','right',{id:'mentor'});
    draw();
  });
}

      skip.remove();
      clearActors();
      S.seenIntro = true; save();
      resolve();
    };
    skip.onclick = finish;

    stage.innerHTML = `<div class="screen" style="min-height:66vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:26px;text-align:center">
      <div id="titleslot">
        <div class="eyebrow" style="justify-content:center">SBP AML/CFT &middot; Training simulation</div>
        <h1 style="font-size:44px;line-height:1.08;font-weight:700;letter-spacing:-.02em;margin-top:12px">
          SENTINEL</h1>
      </div>
      <div id="bubbleslot" style="max-width:640px"></div>
      <div id="ctaslot"></div>
    </div>`;

    (async ()=>{
      await new Promise(r=>setTimeout(r, 700));
      if (cancelled) return;

      actor('elena-explain','right');
      await new Promise(r=>setTimeout(r, 500));
      if (cancelled) return;
      await say('Elena Vance \u00b7 Head of Financial Crime Compliance',
        'You are the last control before the money moves. Everything upstream of you is paperwork. Everything downstream is somebody else\u2019s problem.');
      if (cancelled) return;

      actor('marcus-neutral','left');
      await new Promise(r=>setTimeout(r, 450));
      if (cancelled) return;
      await say('Marcus Hale \u00b7 Senior AML Analyst',
        'Four modules. Onboard a customer who does not want to be onboarded properly, learn the red-flag families by sight, work a live transaction queue, and drill the thresholds until they are reflex.',
        {append:true});
      if (cancelled) return;

      const slot = document.getElementById('ctaslot');
      if (!slot || cancelled) return;
      slot.innerHTML =
        `<button class="cnext" id="beginbtn" style="margin:0">Begin training</button>`;
      const bb = document.getElementById('beginbtn');
      bb.onclick = ()=>{ beep('pick'); finish(); };
      setKeys(e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); bb.click(); } });
    })();
  });
}

/* =====================================================================
   BOOT
   ===================================================================== */
document.getElementById('brand').onclick = home;
document.getElementById('soundbtn').onclick = ()=>{
  S.muted = !S.muted; save(); renderSoundBtn();
  if (!S.muted) beep('pick');
};
document.getElementById('resetbtn').onclick = ()=>{
  if (!confirm('Reset all progress — XP, ranks, badges and best scores?')) return;
  S = {xp:0, best:{}, badges:[], seen:[], muted:S.muted, seenIntro:true};
  save(); renderRank(); home();
  toast('Progress reset', 'Back to Trainee with a clean record.');
};

load();
renderRank();
renderSoundBtn();
if (S.seenIntro) home();
else coldOpen().then(home);
</script>
</body>
</html>
